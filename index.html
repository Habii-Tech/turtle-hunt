<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proposta Comercial — Habii.tech × Turtle Hunt</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Work Sans"', "sans-serif"] },
            fontSize: {
              // Sistema tipográfico — usar SEMPRE estes tokens.
              // [size, { lineHeight, letterSpacing, fontWeight }]
              eyebrow:    ['11px',                  { lineHeight: '1.1',  letterSpacing: '.1em',    fontWeight: '700' }],
              'eyebrow-sm': ['10px',                { lineHeight: '1.1',  letterSpacing: '.14em',   fontWeight: '700' }],
              h1:         ['clamp(52px,6vw,82px)',  { lineHeight: '.95',  letterSpacing: '-.04em',  fontWeight: '900' }],
              h2:         ['clamp(36px,4vw,54px)',  { lineHeight: '1',    letterSpacing: '-.03em',  fontWeight: '900' }],
              h3:         ['22px',                  { lineHeight: '1.1',  letterSpacing: '-.025em', fontWeight: '800' }],
              h4:         ['17px',                  { lineHeight: '1.2',  letterSpacing: '-.015em', fontWeight: '800' }],
              lead:       ['17px',                  { lineHeight: '1.65', fontWeight: '400' }],
              body:       ['15px',                  { lineHeight: '1.65', fontWeight: '400' }],
              'body-sm':  ['13px',                  { lineHeight: '1.65', fontWeight: '400' }],
              caption:    ['12px',                  { lineHeight: '1.5',  fontWeight: '500' }],
              micro:      ['11px',                  { lineHeight: '1.4',  fontWeight: '500' }],
            },
            colors: {
              // Sistema de cores — texto e acentos.
              ink: {
                DEFAULT: '#0C1410', // texto forte / títulos
                strong:  '#0C1410',
                body:    '#374840', // corpo principal
                muted:   '#5C6E64', // corpo secundário
                soft:    '#8FA398', // labels / metadados
              },
              brand: {
                DEFAULT: '#1DB954', // verde puro (acento ativo)
                dark:    '#158A3E', // verde para texto sobre fundo claro
                soft:    '#6EBF8B', // verde suave (em <em>)
                bg:      '#F0FDF4', // background de badge/chip
                border:  '#D1FAE5', // border de badge/chip
              },
              surface: {
                page:    '#F4F8F5', // fundo de slide claro
                card:    '#FFFFFF',
                line:    '#DDE8E2', // borders de card
                dark:    '#1F2B23', // fundo de slide escuro
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="assets/css/proposta.css" />
  </head>
  <body class="font-sans bg-[#F4F8F5] text-[#0C1410] antialiased">
    <!-- UI Fixa de Navegação -->
    <div
      id="progress"
      class="fixed top-0 left-0 h-[3px] bg-[#1DB954] z-[500] transition-[width] duration-[400ms] ease-out"
      style="width: 12.5%"
    ></div>
    <div
      id="dots"
      class="fixed right-10 top-1/2 -translate-y-1/2 z-[500] flex flex-col gap-[9px]"
    ></div>
    <div
      id="counter"
      class="fixed bottom-8 right-10 z-[500] text-[12px] font-bold tracking-[.06em] text-[#C4D0CB]"
    >
      1 / 11
    </div>

    <!-- Container onde os componentes são injetados -->
    <main id="slides-container"></main>

    <!-- Componentes (ordem das seções) -->
    <script src="assets/components/s1-capa.js"></script>
    <script src="assets/components/s2-sobre.js"></script>
<!--    <script src="assets/components/s7-metodologia.js"></script>-->
<!--    <script src="assets/components/s9-portfolio.js"></script>-->
    <script src="assets/components/s3-dores.js"></script>
    <script src="assets/components/s4-escopo.js"></script>
    <script src="assets/components/s4b-solucao.js"></script>
    <script src="assets/components/s6-prazos.js"></script>
    <script src="assets/components/s6b-bonus.js"></script>
    <script src="assets/components/s5-investimento.js"></script>
    <script src="assets/components/s8-encerramento.js"></script>
<!--    <script src="assets/components/s10-obrigado.js"></script>-->

    <!-- Scripts de funcionalidade (carregados após todos os componentes) -->
<!--    <script src="assets/js/cases.js"></script>-->
    <script src="assets/js/carousel.js"></script>
    <script src="assets/js/nav.js"></script>
  </body>
</html>
